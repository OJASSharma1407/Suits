services:
  redis:
    image: redis:7-alpine
    container_name: suits_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: suits_postgres
    restart: always
    environment:
      POSTGRES_USER: suits
      POSTGRES_PASSWORD: suits
      POSTGRES_DB: suits
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suits"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
